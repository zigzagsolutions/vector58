<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site blocked</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">&#x26D4;</div>
      <h1>This site has been blocked</h1>
      <p>Your organization's security policy prevents access to this site.</p>
      <dl>
        <dt>Site</dt>
        <dd id="site">Unavailable</dd>
        <dt>Reason</dt>
        <dd id="category">Security policy</dd>
        <dt>Policy rule</dt>
        <dd id="rule">&ndash;</dd>
      </dl>
      <p class="help">If you believe this is a mistake, contact your IT or security team and include the details above.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
